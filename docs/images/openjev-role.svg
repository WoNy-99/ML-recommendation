<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
<title id="title">OpenJev 질문 해석과 로컬 추천의 역할 분리</title>
<desc id="desc">사용자 질문과 고정 질문 정의, 모델 이름만 외부 OpenJev에 전송한다. 반환 조건을 검증하고 로컬에서 후보 필터와 TF-IDF 순위를 계산한다. Yelp 데이터와 추천 결과는 로컬에 둔다. 실제 실행 화면이나 공식 로고가 아닌 자체 제작 개념도다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="2"/></marker></defs>
<rect width="760" height="900" rx="24" fill="#f1f5f9"/>
<g font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif">
<text x="40" y="48" fill="#0f766e" font-size="17" font-weight="700" letter-spacing="2">2026 PERSONAL EXTENSION</text>
<text x="40" y="92" fill="#0f172a" font-size="32" font-weight="700">질문은 해석하고, 추천은 로컬에서</text>
<rect x="32" y="126" width="696" height="112" rx="18" fill="#fff" stroke="#cbd5e1"/>
<circle cx="68" cy="165" r="19" fill="#e2e8f0"/><text x="62" y="172" fill="#334155" font-size="21" font-weight="700">1</text>
<text x="102" y="172" fill="#0f172a" font-size="26" font-weight="700">사용자 질문</text>
<text x="58" y="213" fill="#475569" font-size="22">필라델피아에서 이탈리안 음식점을 추천해줘</text>
<path d="M380 244 V276" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="290" width="696" height="178" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<circle cx="68" cy="330" r="19" fill="#2563eb"/><text x="62" y="337" fill="#fff" font-size="21" font-weight="700">2</text>
<text x="102" y="337" fill="#1e3a8a" font-size="26" font-weight="700">OpenJev · 음식 종류 해석</text>
<text x="58" y="382" fill="#334155" font-size="23">외부 수신: 질문 + 고정 질문 정의 + 모델 이름</text>
<text x="58" y="426" fill="#1d4ed8" font-size="23" font-weight="700">Choice 반환 → 조건 검증</text>
<path d="M380 475 V510" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="524" width="696" height="224" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<circle cx="68" cy="564" r="19" fill="#047857"/><text x="62" y="571" fill="#fff" font-size="21" font-weight="700">3</text>
<text x="102" y="571" fill="#064e3b" font-size="26" font-weight="700">로컬 · 필터와 TF-IDF 순위</text>
<text x="58" y="617" fill="#334155" font-size="24">도시·음식 종류 조건으로 후보 필터</text>
<text x="58" y="659" fill="#334155" font-size="24">학습 구간 리뷰의 TF-IDF로 질의 유사도 계산</text>
<text x="58" y="707" fill="#047857" font-size="23" font-weight="700">Yelp 데이터·후보·추천 결과는 로컬에만</text>
<rect x="32" y="778" width="696" height="90" rx="16" fill="#0f172a"/>
<text x="56" y="815" fill="#fff" font-size="23" font-weight="700">모호하거나 미지원 조건이면 추천하지 않음</text>
<text x="56" y="850" fill="#cbd5e1" font-size="20">개념도 · 성능 개선이나 모델 간 우위를 뜻하지 않음</text>
</g></svg>